<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutritionPlan - Diet Planner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f3ed;
            color: #4a403b;
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e6dcd0;
            padding-bottom: 12px;
        }
        nav h2 { margin: 0; color: #5c4033; }
        .nav-link {
            text-decoration: none;
            background-color: #8c6d53;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        .nav-link:hover { background-color: #70543f; }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e6dcd0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #5c4033; }
        input, select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d4c5b9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            background-color: #fff;
        }
        input:focus, select:focus { border-color: #a4846c; }
        button {
            padding: 10px 18px;
            background-color: #8c6d53;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background-color: #70543f; }
        .danger-btn { background-color: #b71c1c; }
        .danger-btn:hover { background-color: #8e1212; }
        ul { list-style: none; padding: 0; }
        li {
            background: #faf7f2;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #e6dcd0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .calc-box {
            background: #efeae2;
            padding: 15px;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 15px;
            color: #5c4033;
        }
    </style>
</head>
<body>
    <nav>
        <h2>🥗 Diet Planner & Daily Log</h2>
        <a href="index.html" class="nav-link">⬅ Back to Search</a>
    </nav>

    <!-- Task 3: Suggestion Logic Section (recommendation box)-->
    <div class="card">
        <h3 style="margin-top: 0; color: #5c4033;">💡 Daily Diet Recommendation</h3>
        <div class="form-group">
            <label for="goal-select">What is your current health goal?</label>
            <select id="goal-select">
                <option value="weight-loss">Weight Loss</option>
                <option value="muscle-gain" selected>Muscle Building</option>
                <option value="maintenance">Balanced Diet Maintenance</option>
            </select>
        </div>
        <button id="get-suggestion-btn">Get Recommendation</button>

        <div id="suggestion-container" style="display: none; margin-top: 20px; background: #ffffff; border: 1px solid #e8e0d5; border-radius: 12px; box-shadow: 0 4px 12px rgba(92, 64, 51, 0.08); overflow: hidden;">
            
            <div style="background-color: #f5efe6; padding: 14px 18px; border-bottom: 1px solid #e8e0d5; display: flex; align-items: center; justify-content: space-between;">
                <h4 id="suggestion-title" style="margin: 0; color: #5c4033; font-size: 15px; font-weight: 700;"></h4>
                <span id="suggestion-tag" style="background: #8c6d53; color: #ffffff; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;"></span>
            </div>
            
            <div style="padding: 18px;">
                <p id="suggestion-desc" style="margin: 0 0 16px 0; color: #6b5e55; font-size: 13px; line-height: 1.5;"></p>

                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px;">
                    <div style="background: #faf7f2; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #eee6dc;">
                        <div style="font-size: 11px; color: #8c7b70; font-weight: 600; text-transform: uppercase; margin-bottom: 2px;">Protein</div>
                        <div id="macro-protein" style="font-weight: 700; color: #5c4033; font-size: 15px;"></div>
                    </div>
                    <div style="background: #faf7f2; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #eee6dc;">
                        <div style="font-size: 11px; color: #8c7b70; font-weight: 600; text-transform: uppercase; margin-bottom: 2px;">Carbs</div>
                        <div id="macro-carbs" style="font-weight: 700; color: #5c4033; font-size: 15px;"></div>
                    </div>
                    <div style="background: #faf7f2; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #eee6dc;">
                        <div style="font-size: 11px; color: #8c7b70; font-weight: 600; text-transform: uppercase; margin-bottom: 2px;">Fats</div>
                        <div id="macro-fats" style="font-weight: 700; color: #5c4033; font-size: 15px;"></div>
                    </div>
                </div>

                <div>
                    <div style="font-size: 12px; font-weight: 700; color: #5c4033; margin-bottom: 8px;">Recommended Foods:</div>
                    <div id="food-tags" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
                </div>
            </div>
        </div>
    </div> 

    <!-- Task 5 & 6 & 7: CRUD Management (food intake box) -->
    <div class="card">
        <h3 id="form-heading" style="margin-top: 0; color: #5c4033;">📝 Log Food Intake</h3>
        <input type="hidden" id="edit-index" value="-1">
        <div class="form-group">
            <label>Food / Meal Name:</label>
            <input type="text" id="record-food" placeholder="e.g., Oatmeal & Dates">
        </div>
        <div class="form-group">
            <label>Calories (kcal):</label>
            <input type="number" id="record-cal" placeholder="e.g., 350">
        </div>
        <button id="save-record-btn">Save Entry</button>
        <button id="cancel-edit-btn" style="display:none; background-color: #7f8c8d;" onclick="resetForm()">Cancel</button>
        <p id="crud-feedback" style="margin-top: 10px; font-size: 13px; font-weight: 600;"></p>
    </div>

    <!-- (Today's Meal Log box) -->
    <div class="card">
        <h3 style="margin-top: 0; color: #5c4033;">📋 Today's Meal Log</h3>
        <ul id="record-list">
        </ul>

        <div class="calc-box" id="total-calculation">
            📊 Total Calorie Intake: 0 kcal
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
